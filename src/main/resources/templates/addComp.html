<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<title>新規登録</title>
</head>
<body>
	<div id="wapper">
		<div class="menu">
			<a href="/">メニュー</a>
		</div>
		<div class="menu">
			<h2>新規登録 完了画面</h2>
			<p>以下のデータが登録されました</p>
		</div>
		<table class="ct">
			<tbody>
				<tr>
					<th>社員ID</th>
					<td th:text="${saveMember.memberId}"></td>
				</tr>
				<tr>
					<th>氏名</th>
					<td th:text="${saveMember.name}"></td>
				</tr>
				<tr>
					<th>年齢</th>
					<td th:text="${saveMember.age}"></td>
				</tr>
				<tr>
					<th>性別</th>
					<td th:text="${saveMember.sexName}"></td>
				</tr>
				<tr>
					<th>住所</th>
					<td th:text="${saveMember.address}"></td>
				</tr>
				<tr>
					<th>電話番号</th>
					<td th:text="${saveMember.tel}"></td>
				</tr>
				<tr>
					<th>メールアドレス</th>
					<td th:text="${saveMember.mail}"></td>
				</tr>
				<tr>
					<th>役職</th>
					<td th:text="${saveMember.mstPosition.positionName}"></td>
				</tr>
				<tr>
					<th>事業所</th>
					<td th:text="${saveMember.mstPlace.placeName}"></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
