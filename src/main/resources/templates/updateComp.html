<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<title>更新</title>
</head>
<body>
	<div id="wapper">
		<div class="menu">
			<a href="/">メニュー</a><br>
			<a href="/list">メンバ一覧</a>
		</div>
		<div class="menu">
			<h2>更新完了画面</h2>
			<p>以下のデータに更新されました</p>
		</div>
		<table class="ct">
			<tbody>
				<tr>
					<th>社員ID</th>
					<td th:text="${updateMember.memberId}"></td>
				</tr>
				<tr>
					<th>氏名</th>
					<td th:text="${updateMember.name}"></td>
				</tr>
				<tr>
					<th>年齢</th>
					<td th:text="${updateMember.age}"></td>
				</tr>
				<tr>
					<th>性別</th>
					<td th:text="${updateMember.sexName}"></td>
				</tr>
				<tr>
					<th>住所</th>
					<td th:text="${updateMember.address}"></td>
				</tr>
				<tr>
					<th>電話番号</th>
					<td th:text="${updateMember.tel}"></td>
				</tr>
				<tr>
					<th>メールアドレス</th>
					<td th:text="${updateMember.mail}"></td>
				</tr>
				<tr>
					<th>役職</th>
					<td th:text="${updateMember.mstPosition.positionName}"></td>
				</tr>
				<tr>
					<th>事業所</th>
					<td th:text="${updateMember.mstPlace.placeName}"></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
